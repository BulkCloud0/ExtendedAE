name: 1.16.5 Forge build

on:
  push:
    branches: [ "1.16.5-forge" ]
  pull_request:
    branches: [ "1.16.5-forge" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExtendedAE-1.16.5
          path: build/libs/*.jar
